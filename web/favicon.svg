✒ Description:
    The page's tab icon: the Agent Watch agent, its suit in the header's
    gold, its visor dark, its cuffs bronze and its eyes in parchment, on the
    header's navy tile.

✒ Key Features:
    - The figure only: the workflow paths are too fine to read at 16 px
    - Drawn from the logo's own paths, so the two never differ in shape
    - The header's navy (#1B2A4A) and gold (#C9A84C)

✒ Other Important Information:
    - Dependencies: none
    - Compatible platforms: any browser that shows SVG favicons
